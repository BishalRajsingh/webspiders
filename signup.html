<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up</title>

  <link rel="stylesheet" href="css/signup.css" />
  <link rel="stylesheet" href="css/variables.css">
  <script defer src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
  <script defer src="js/signup.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <main class="auth">

    <div class="auth-card">

      <!-- <div class="auth-icon">
        <i class="fa-solid fa-arrow-right-to-bracket" aria-hidden="true"></i>
      </div> -->

      <h1>Sign in with email</h1>
      <p class="subtitle">
        Enter your details below to create your account and get started.
      </p>

      <form id="signupForm" novalidate>

        <div class="field">
          <i class="fa-regular fa-envelope" aria-hidden="true"></i>
          <input type="email" id="email" placeholder="Email" />
          <small class="error"></small>
        </div>

        <div class="field">
          <i class="fa-solid fa-lock" aria-hidden="true"></i>
          <input type="password" id="password" placeholder="Password" />
          <button type="button" class="eye">
            <i class="fa-regular fa-eye-slash" aria-hidden="true"></i>
          </button>
          <small class="error"></small>
        </div>

        <a href="#" class="forgot">Forgot password?</a>

        <button type="submit" class="btn primary">
          <span class="btn-text">Get Started</span>
          <span class="loader"></span>
        </button>
        <a href="index.html" class="btn btn-outline">
          Go Back
        </a>
        <p class="success" aria-live="polite"></p>

        <div class="divider">
          <span>or sign in with</span>
        </div>

        <div class="social-login">
          <button aria-label="Google"><i class="fa-brands fa-google" aria-hidden="true"></i></button>
          <button aria-label="Facebook"><i class="fa-brands fa-facebook-f" aria-hidden="true"></i></button>
          <button aria-label="Apple"><i class="fa-brands fa-apple" aria-hidden="true"></i></button>
        </div>

      </form>


    </div>

  </main>
</body>

</html>
