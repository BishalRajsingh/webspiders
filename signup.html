<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/signup.css" />


  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>
  <a href="#main-content" class="skip-link">
    Skip to main content
  </a>
  <main id="main-content" class="auth">

    <div class="auth-card">
      <h1>Sign in with email</h1>
      <p class="subtitle">
        Enter your details below to create your account and get started.
      </p>

      <form id="signupForm" novalidate>

        <div class="field">
          <label for="email" class="field-label">Email</label>
          <i class="fa-regular fa-envelope" aria-hidden="true"></i>
          <input type="email" id="email" placeholder="Email" />
          <small class="error"></small>
        </div>

        <div class="field">
          <label for="password" class="field-label">Password</label>
          <i class="fa-solid fa-lock" aria-hidden="true"></i>
          <input type="password" id="password" placeholder="Password" />
          <button type="button" class="eye">
            <i class="fa-regular fa-eye-slash" aria-hidden="true"></i>
          </button>
          <small class="error"></small>
        </div>

        <button type="button" class="forgot">
          Forgot password?
        </button>

        <button type="submit" class="btn primary">
          <span class="btn-text">Get Started</span>
          <span class="loader"></span>
        </button>
        <a href="index.html" class="btn btn-outline">
          Go Back
        </a>
        <p class="success" aria-live="polite"></p>

        <div class="divider">
          <span>or sign in with</span>
        </div>

        <div class="social-login" role="group" aria-labelledby="social-login-label">
          <span id="social-login-label" class="sr-only">
            Sign in using social accounts
          </span>
          <button type="button" aria-label="Sign in with Google"><i class="fa-brands fa-google"
              aria-hidden="true"></i></button>
          <button type="button" aria-label="Sign in with Facebook"><i class="fa-brands fa-facebook-f"
              aria-hidden="true"></i></button>
          <button type="button" aria-label="Sign in with Apple"><i class="fa-brands fa-apple"
              aria-hidden="true"></i></button>
        </div>

      </form>


    </div>

  </main>

  <script defer src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
  <script defer src="js/signup.js"></script>
</body>

</html>
